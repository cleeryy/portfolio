# /etc/nginx/conf.d/default.conf — server block only (included from http{}).
#
# Container port: 8080 (nginx-unprivileged image, runs as uid 101).
# Served file layout: /usr/share/nginx/html/index.html + /assets/*

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Do not advertise the nginx version in error pages / Server header.
    server_tokens off;

    # ETags let the browser revalidate cheaply (304s for index.html).
    etag on;

    # gzip: only text-ish payloads + svg + woff2.
    # (woff2 is already compressed, so this is effectively a no-op — kept
    # because it is harmless and some CDN/proxy chains still expect it.)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff2;

    # Nothing is uploaded by this app.
    client_max_body_size 1m;

    # --- Security headers ---------------------------------------------------
    # NOTE nginx add_header inheritance: a location that declares ANY add_header
    # directive does NOT inherit the ones declared here. The /assets/ and
    # = /index.html blocks below therefore repeat these four headers.
    # No CSP by default: three.js/WebGL and Vite's module preload need review.
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN"                     always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # --- Content-Security-Policy (DRAFT — intentionally left disabled) -----
    # Enable once the built bundle has been checked in the browser console.
    # three.js may need blob: workers, and Vite injects an inline module
    # preload shim; tighten script-src with hashes instead of 'unsafe-inline'
    # if you can. Serve over HTTPS only before adding upgrade-insecure-requests.
    #
    # add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:; frame-ancestors 'self'; form-action 'self'" always;

    # --- SPA fallback -------------------------------------------------------
    # Today the site only uses in-page anchors, but unknown paths (e.g. a
    # future /work/foo deep link) must still land on the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed files under /assets/ — cache them forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Re-declared because of add_header inheritance (see above).
        add_header X-Content-Type-Options    "nosniff"                        always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options           "SAMEORIGIN"                     always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    }

    # The document references hashed assets: never let it go stale.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        # Re-declared because of add_header inheritance (see above).
        add_header X-Content-Type-Options    "nosniff"                        always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options           "SAMEORIGIN"                     always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    }
}
